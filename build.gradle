buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.7.3'
group = 'art.arcane.extrautilitiesrebirth'
archivesBaseName = 'extrautilitiesrebirth'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def gameTestProfile = providers.gradleProperty('minimalRuntime').map { it.toBoolean() ? 'minimal' : 'integrations' }.orElse('integrations')

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        gameTestServer {
            workingDirectory project.file("build/forge-gametest/${gameTestProfile.get()}")
            property 'forge.enabledGameTestNamespaces', 'extrautilitiesrebirth'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            jvmArgs '-Djava.awt.headless=true'
            mods {
                examplemod {
                    source sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            args 'nogui'
            jvmArgs '-Djava.awt.headless=true'

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/mods.toml') {
        expand modVersion: project.version
    }
}

apply from: 'mcreator.gradle'


tasks.register('deployToModpack', Copy) {
    group = 'distribution'
    description = 'Copy the reobfuscated mod jar into the PrismLauncher modpack.'
    dependsOn tasks.named('reobfJar')
    from tasks.named('jar')
    def defaultModsDir = new File(System.getProperty('user.home'),
            'Library/Application Support/PrismLauncher/instances/Auram/minecraft/mods')
    into providers.gradleProperty('modpackModsDir').map { file(it) }.orElse(defaultModsDir)
    rename { 'ExtraUtilities.jar' }
}
